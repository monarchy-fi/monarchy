[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "out"
libs = ["lib", "node_modules"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read-write", path = "./deployments" }]
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "forge-std/=lib/forge-std/src/",
]

# Offline profile for sandboxed environments that cannot download solc.
# Uses tools/solc, a shim around the solc npm package (solcjs).
[profile.offline]
solc = "tools/solc"
offline = true
auto_detect_solc = false

[rpc_endpoints]
elysium_testnet = "${RPC_URL}"

[fmt]
line_length = 110
[lint]
lint_on_build = false
