name: Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The site password lives only in the SITE_PASSWORD Actions secret. Exactly two plain shell steps
      # read it, through step-level env: this guard and the encrypt step. It is never job-level env, so
      # no third-party action, not npm ci (whose lifecycle scripts run code from every dependency) and
      # not the Vite build sees it. Every action is pinned to a commit SHA. This log is public, so no
      # step prints anything derived from the password.
      - name: Require the site password
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          if [ -z "${SITE_PASSWORD// /}" ]; then
            echo "::error::The SITE_PASSWORD secret is missing or empty. Refusing to deploy the site unencrypted."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # base_path is "" on a custom domain and "/monarchy" on monarchy-fi.github.io
      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
        working-directory: web
      # One self-contained index.html (all JS and CSS inlined), built without the secret in its environment.
      - name: Build
        run: npm run build
        working-directory: web
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      # Encrypts it with staticrypt and copies it to 404.html, so deep links like /exile show the same
      # password page and then open the right route. The only build step that sees the password.
      - name: Encrypt
        run: node gate/encrypt.mjs
        working-directory: web
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Check nothing is served unencrypted
        working-directory: web/dist
        run: |
          for f in index.html 404.html; do
            grep -q staticryptEncryptedMsgUniqueVariableName "$f" || { echo "::error::$f is not encrypted"; exit 1; }
            if grep -q lockERC20 "$f"; then echo "::error::$f contains app code in plain text"; exit 1; fi
          done
          if find . -type f \( -name '*.js' -o -name '*.css' -o -name '*.json' -o -name '*.map' \) | grep -q .; then
            echo "::error::dist has script, style or data files outside the encrypted page"; exit 1
          fi
          ls -la
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
